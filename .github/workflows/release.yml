name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix), e.g. 0.1.0'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_REF#refs/tags/}"
            echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build icon
        shell: pwsh
        run: ./scripts/build-icon.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version ${{ needs.resolve-version.outputs.version }}
      - name: Stage installer artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifacts/upload | Out-Null
          $setup = Get-ChildItem artifacts/velopack -Filter "*Setup.exe" | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "artifacts/upload/ShushVault-$version-Setup.exe"
          } else {
            Write-Error "No Setup.exe found in artifacts/velopack"
            exit 1
          }
          $portable = Get-ChildItem artifacts/velopack -Filter "*Portable.zip" | Select-Object -First 1
          if ($portable) {
            Copy-Item $portable.FullName "artifacts/upload/ShushVault-$version-Portable.zip"
          }
          $fullPkg = Get-ChildItem artifacts/velopack -Filter "ShushVault-$version-full.nupkg" | Select-Object -First 1
          if ($fullPkg) {
            Copy-Item $fullPkg.FullName artifacts/upload/
          }
          Get-ChildItem artifacts/upload
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/upload/*

  linux:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Build
        run: cargo build --release --manifest-path src/ShushVault.Linux/Cargo.toml
      - name: Stage tarball
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve-version.outputs.version }}"
          stage="staging/shush-vault-${version}-linux-x64"
          mkdir -p "$stage"
          cp src/ShushVault.Linux/target/release/shush-vault-linux "$stage/shush-vault"
          cp assets/shush-vault-logo.png "$stage/shush-vault.png" || true
          cat > "$stage/shush-vault.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Shush Vault
          Exec=shush-vault
          Icon=shush-vault
          Categories=Utility;
          Terminal=false
          EOF
          cat > "$stage/README.txt" <<EOF
          Shush Vault for Linux (GTK 4)

          Requires libgtk-4-1 installed:
            Debian/Ubuntu:  sudo apt install libgtk-4-1
            Fedora:         sudo dnf install gtk4
            Arch:           sudo pacman -S gtk4

          To run:
            ./shush-vault
          EOF
          mkdir -p artifacts
          tar -C staging -czf "artifacts/shush-vault-${version}-linux-x64.tar.gz" "shush-vault-${version}-linux-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*

  macos:
    needs: resolve-version
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release --package-path src/ShushVault.Mac
      - name: Wrap in .app bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve-version.outputs.version }}"
          app="staging/Shush Vault.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp src/ShushVault.Mac/.build/release/ShushVaultMac "$app/Contents/MacOS/ShushVault"
          chmod +x "$app/Contents/MacOS/ShushVault"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>ShushVault</string>
            <key>CFBundleIdentifier</key><string>com.jasperdevs.shushvault</string>
            <key>CFBundleName</key><string>Shush Vault</string>
            <key>CFBundleDisplayName</key><string>Shush Vault</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
          </dict>
          </plist>
          EOF
      - name: Import signing certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in keychain"
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Sign app
        shell: bash
        run: |
          set -euo pipefail
          app="staging/Shush Vault.app"
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$app/Contents/MacOS/ShushVault"
          codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve-version.outputs.version }}"
          dmg_stage="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$dmg_stage"
          cp -R "staging/Shush Vault.app" "$dmg_stage/"
          ln -s /Applications "$dmg_stage/Applications"
          mkdir -p artifacts
          dmg="artifacts/ShushVault-${version}-macos.dmg"
          hdiutil create -volname "Shush Vault" -srcfolder "$dmg_stage" -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$dmg"
      - name: Notarize and staple (best effort)
        shell: bash
        timeout-minutes: 15
        continue-on-error: true
        run: |
          set -euo pipefail
          version="${{ needs.resolve-version.outputs.version }}"
          dmg="artifacts/ShushVault-${version}-macos.dmg"
          KEY_PATH="$RUNNER_TEMP/notary.p8"
          echo "$MACOS_NOTARY_KEY" | base64 --decode > "$KEY_PATH"

          NOTARY_ARGS=(--key "$KEY_PATH" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID")

          echo "Submitting $dmg to Apple notary..."
          submit_json=$(xcrun notarytool submit "$dmg" "${NOTARY_ARGS[@]}" --output-format json)
          echo "$submit_json"
          submission_id=$(echo "$submit_json" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          echo "Submission ID: $submission_id"

          echo "Waiting up to 12 min for notarization (best effort)..."
          if xcrun notarytool wait "$submission_id" "${NOTARY_ARGS[@]}" --timeout 12m; then
            xcrun notarytool log "$submission_id" "${NOTARY_ARGS[@]}" || true
            status=$(xcrun notarytool info "$submission_id" "${NOTARY_ARGS[@]}" --output-format json | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')
            echo "Final status: $status"
            if [ "$status" = "Accepted" ]; then
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
              echo "DMG notarized and stapled."
            else
              echo "Notarization not accepted (status: $status). Shipping signed-only DMG."
            fi
          else
            echo "Apple notary did not respond in time. Shipping signed-only DMG."
            echo "Submission $submission_id remains in Apple's queue and can be stapled later."
          fi
          rm -f "$KEY_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/*

  release:
    needs: [resolve-version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve-version.outputs.version }}"
          tag="v${version}"
          notes_file=$(mktemp)
          cat > "$notes_file" <<'EOF'
          Cross-platform builds for testing.

          ### Windows
          Run **ShushVault-VERSION-Setup.exe**. Updates ship via Velopack.

          ### macOS
          Open **ShushVault-VERSION-macos.dmg** and drag **Shush Vault** to Applications. Signed with Developer ID. If macOS blocks the first launch, right-click the app → **Open** → confirm.

          Requires macOS 14 or newer.

          ### Linux
          Extract the tarball and run `./shush-vault`. Requires GTK 4:
          ```
          sudo apt install libgtk-4-1   # Debian/Ubuntu
          sudo dnf install gtk4         # Fedora
          ```
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" --title "Shush Vault $tag" --notes-file "$notes_file" dist/*
          fi
