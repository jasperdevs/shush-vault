[package]
name = "shush"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
rpassword = "7"
serde_json = "1"
shush-vault-core = { path = "../shush-vault-core" }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
